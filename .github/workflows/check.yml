name: Check

on:
    push:
    pull_request:

jobs:
    solutions:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Express for the Node.js on the Server section
              run: npm ci
              working-directory: 24-node-on-the-server
            - name: Every solution passes its tests
              run: npm run test:solutions

    reading-list:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 21-our-first-project/reading-list
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build
