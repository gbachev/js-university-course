<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Array.from() with a NodeList</title>
</head>
<body>
    <h1>Array.from() with a NodeList</h1>
    <p>Open the console. querySelectorAll() gives a NodeList of the three boxes below, and
        Array.from() turns it into a real array.</p>
    <div>Box 1</div>
    <div>Box 2</div>
    <div>Box 3</div>

    <script>
        const divs = document.querySelectorAll('div');
        const divArray = Array.from(divs);

        console.log(Array.isArray(divs)); // false
        console.log(Array.isArray(divArray)); // true
        console.log(divArray.length); // 3
    </script>
</body>
</html>
