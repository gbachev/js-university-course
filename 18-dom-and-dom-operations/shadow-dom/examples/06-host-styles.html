<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Cards</title>
    <style>
        p { color: red; }
        .title { font-size: 40px; }
    </style>
</head>
<body>
    <p>Free shipping over 50 EUR</p>
    <div id="card"></div>
    <book-card price="32.5">
        <strong>Async Nights</strong>
        <span slot="author">Jane Doe</span>
    </book-card>

    <!-- A div, not a p, so the snippet counts only the p elements of the lecture. -->
    <div>Open the console. :host styles the card itself, and :host(.sale) gives it an orange border.</div>

    <script src="06-host-styles.js"></script>
</body>
</html>
