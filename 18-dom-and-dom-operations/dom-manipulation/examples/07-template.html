<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reading List</title>
</head>
<body>
    <h1>To Read</h1>
    <ul>
        <li>Dune</li>
        <li>Emma</li>
    </ul>
    <template id="book-row">
        <li class="book">
            <strong class="title"></strong> by <span class="author"></span>
        </li>
    </template>

    <p>Open the console. The script fills a template for each book.</p>

    <script src="07-template.js"></script>
</body>
</html>
