<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Announcing changes with aria-live</title>
        <script src="06-aria-live.js" defer></script>
    </head>
    <body>
        <p>Open the console. The page adds Neuromancer as it loads and writes the news into the live region below the button.</p>
        <h1 id="list-heading" tabindex="-1">To Read</h1>
        <ul id="books">
            <li>Dune <button>Remove</button></li>
            <li>Emma <button>Remove</button></li>
        </ul>
        <div id="clear">Clear list</div>
        <button id="add">Add a book</button>
        <p id="status" aria-live="polite"></p>
    </body>
</html>
