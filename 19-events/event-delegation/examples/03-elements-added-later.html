<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Elements added later</title>
        <script src="03-elements-added-later.js" defer></script>
    </head>
    <body>
        <p>Open the console. The list's listener also works for a book added later.</p>
        <ul id="shelves">
            <li class="shelf">
                <h2>To Read</h2>
                <ul id="book-list">
                    <li data-key="dune">
                        <span class="title">Dune</span>
                        <button data-action="toggle">Mark read</button>
                        <button data-action="remove">
                            <span class="icon">×</span> Remove
                        </button>
                    </li>
                    <li data-key="emma">
                        <span class="title">Emma</span>
                        <button data-action="toggle">Mark read</button>
                        <button data-action="remove">
                            <span class="icon">×</span> Remove
                        </button>
                    </li>
                </ul>
            </li>
        </ul>
    </body>
</html>
