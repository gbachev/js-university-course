<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 1: One listener for the list</title>
</head>
<!--
    Task 1: One listener for the list
    Our code goes in 01-one-listener.js, the checks are in 01-one-listener.check.js.
    Run npm run serve, open this page and read the checks at the bottom.
    Add ?solutions to the address to run the checks against the solution.
-->
<body>
    <h1>Task 1: One listener for the list</h1>
    <p>Change setUpRemoving() in 01-one-listener.js, then reload this page.</p>

    <ul id="book-list">
        <li data-key="dune">
            <span class="title">Dune</span>
            <button data-action="remove"><span class="icon">×</span> Remove</button>
        </li>
        <li data-key="emma">
            <span class="title">Emma</span>
            <button data-action="remove"><span class="icon">×</span> Remove</button>
        </li>
    </ul>
    <p><output id="count">2 books</output></p>

    <script type="module">
        import { source } from '/lib/browser-check.js';
        await import(source('01-one-listener.js'));
        await import('./01-one-listener.check.js');
    </script>
</body>
</html>
