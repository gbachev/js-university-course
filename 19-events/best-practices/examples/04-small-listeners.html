<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Keep listeners small</title>
        <script src="04-small-listeners.js" defer></script>
    </head>
    <body>
        <p>Open the console. The listener only finds the book; markRead() does the work.</p>
        <ul id="shelves">
            <li class="shelf">
                <h2>To Read</h2>
                <ul id="book-list">
                    <li data-key="dune">
                        <span class="title">Dune</span>
                        <button data-action="toggle">Mark read</button>
                        <button data-action="remove">
                            <span class="icon">×</span> Remove
                        </button>
                    </li>
                    <li data-key="emma">
                        <span class="title">Emma</span>
                        <button data-action="toggle">Mark read</button>
                        <button data-action="remove">
                            <span class="icon">×</span> Remove
                        </button>
                    </li>
                </ul>
            </li>
        </ul>
        <form id="add-book">
            <input name="title" required>
            <label>
                <input type="checkbox" name="tags" value="classic"> Classic
            </label>
            <label>
                <input type="checkbox" name="tags" value="sci-fi"> Sci-fi
            </label>
            <button>Add</button>
        </form>
    </body>
</html>
