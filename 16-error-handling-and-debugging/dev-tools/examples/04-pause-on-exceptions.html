    <h1>Pause on exceptions</h1>
    <p>Open DevTools. The console shows an uncaught TypeError, on purpose. In the Sources
        panel, check "Pause on uncaught exceptions" in the Breakpoints pane and reload: the
        debugger stops on the throwing line, and the Scope pane shows <code>i</code>.</p>
