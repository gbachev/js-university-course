<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Job Application Tracker</title>
    </head>
    <body>
        <header class="page-header">
            <h1>Job Application Tracker</h1>
            <div id="account" class="account" hidden>
                <span id="account-email"></span>
                <button type="button" id="logout-button">Log out</button>
            </div>
        </header>

        <p id="app-status" class="app-status" role="status">Loading…</p>

        <!-- Only one of the two <main> elements is shown at a time; the other
             has the hidden attribute. -->
        <main id="auth-view" class="layout" hidden>
            <section class="panel" aria-labelledby="login-heading">
                <h2 id="login-heading" tabindex="-1">Log in</h2>
                <!-- novalidate: the server checks every field and sends a message
                     for each one, which we show under the field. -->
                <form id="login-form" class="form" novalidate>
                    <p class="form-error" role="alert"></p>
                    <div class="field">
                        <label for="login-email">Email</label>
                        <input
                            id="login-email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            aria-describedby="login-email-error"
                        />
                        <p id="login-email-error" class="field-error"></p>
                    </div>
                    <div class="field">
                        <label for="login-password">Password</label>
                        <input
                            id="login-password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            aria-describedby="login-password-error"
                        />
                        <p id="login-password-error" class="field-error"></p>
                    </div>
                    <button type="submit">Log in</button>
                </form>
            </section>

            <section class="panel" aria-labelledby="signup-heading">
                <h2 id="signup-heading">Create an account</h2>
                <form id="signup-form" class="form" novalidate>
                    <p class="form-error" role="alert"></p>
                    <div class="field">
                        <label for="signup-email">Email</label>
                        <input
                            id="signup-email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            aria-describedby="signup-email-error"
                        />
                        <p id="signup-email-error" class="field-error"></p>
                    </div>
                    <div class="field">
                        <label for="signup-password">Password</label>
                        <input
                            id="signup-password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            required
                            aria-describedby="signup-password-hint signup-password-error"
                        />
                        <p id="signup-password-hint" class="hint">
                            8 to 128 characters
                        </p>
                        <p id="signup-password-error" class="field-error"></p>
                    </div>
                    <button type="submit">Create account</button>
                </form>
            </section>
        </main>

        <main id="tracker-view" class="layout" hidden>
            <section class="panel" aria-labelledby="form-heading">
                <h2 id="form-heading">Add an application</h2>
                <form id="application-form" class="form" novalidate>
                    <p class="form-error" role="alert"></p>
                    <div class="field">
                        <label for="company">Company</label>
                        <input
                            id="company"
                            name="company"
                            required
                            aria-describedby="company-error"
                        />
                        <p id="company-error" class="field-error"></p>
                    </div>
                    <div class="field">
                        <label for="role">Role</label>
                        <input
                            id="role"
                            name="role"
                            required
                            aria-describedby="role-error"
                        />
                        <p id="role-error" class="field-error"></p>
                    </div>
                    <div class="field">
                        <label for="status">Status</label>
                        <select
                            id="status"
                            name="status"
                            aria-describedby="status-error"
                        >
                            <option value="wishlist">Wishlist</option>
                            <option value="applied">Applied</option>
                            <option value="interview">Interview</option>
                            <option value="offer">Offer</option>
                            <option value="rejected">Rejected</option>
                        </select>
                        <p id="status-error" class="field-error"></p>
                    </div>
                    <div class="field">
                        <label for="appliedOn">Applied on</label>
                        <input
                            id="appliedOn"
                            name="appliedOn"
                            type="date"
                            aria-describedby="appliedOn-error"
                        />
                        <p id="appliedOn-error" class="field-error"></p>
                    </div>
                    <div class="field">
                        <label for="url">Link to the job posting</label>
                        <input
                            id="url"
                            name="url"
                            type="url"
                            placeholder="https://"
                            aria-describedby="url-error"
                        />
                        <p id="url-error" class="field-error"></p>
                    </div>
                    <div class="field">
                        <label for="notes">Notes</label>
                        <textarea
                            id="notes"
                            name="notes"
                            rows="4"
                            aria-describedby="notes-error"
                        ></textarea>
                        <p id="notes-error" class="field-error"></p>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="save-button">
                            Add application
                        </button>
                        <button type="button" id="cancel-button" hidden>
                            Cancel
                        </button>
                    </div>
                </form>
            </section>

            <section class="panel" aria-labelledby="list-heading">
                <!-- tabindex="-1": script can focus it, Tab skips it -->
                <h2 id="list-heading" tabindex="-1">My applications</h2>
                <div class="filter">
                    <label for="status-filter">Show</label>
                    <select id="status-filter">
                        <option value="all">All</option>
                        <option value="wishlist">Wishlist</option>
                        <option value="applied">Applied</option>
                        <option value="interview">Interview</option>
                        <option value="offer">Offer</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <p id="list-status" class="status" role="status"></p>
                <ul id="application-list" class="applications"></ul>
            </section>
        </main>

        <template id="application-template">
            <li class="application">
                <div class="details">
                    <p class="company"></p>
                    <p class="role"></p>
                    <p class="meta">
                        <span class="badge"></span>
                        <span class="applied-on"></span>
                    </p>
                    <p class="link">
                        <a target="_blank" rel="noopener noreferrer"></a>
                    </p>
                    <p class="notes"></p>
                </div>
                <div class="actions">
                    <button type="button" data-action="edit">Edit</button>
                    <button type="button" data-action="delete">Delete</button>
                </div>
            </li>
        </template>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
