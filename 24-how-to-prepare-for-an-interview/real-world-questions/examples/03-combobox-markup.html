<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Autocomplete markup</title>
    </head>
    <body>
        <p>The markup of an accessible autocomplete, without its script. Open DevTools and look at the input and the list in the Elements panel and its Accessibility pane.</p>

        <label for="search">Search books</label>
        <input id="search" role="combobox" aria-autocomplete="list"
            aria-expanded="true" aria-controls="suggestions"
            aria-activedescendant="option-1">
        <ul id="suggestions" role="listbox"
            aria-label="Book suggestions">
            <li id="option-0" role="option">Dune</li>
            <li id="option-1" role="option" aria-selected="true">
                Dune Messiah
            </li>
        </ul>
        <p id="status" aria-live="polite">2 suggestions</p>
    </body>
</html>
