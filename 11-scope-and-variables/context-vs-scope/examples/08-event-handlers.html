<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Context in event handlers</title>
</head>
<body>
    <h1>Context in event handlers</h1>
    <p>Open the console, then click the button. The handler logs the button element.</p>
    <button type="button">Click me</button>

    <script>
        const button = document.querySelector('button');

        button.addEventListener('click', function () {
            console.log(this); // the button element
        });
    </script>
</body>
</html>
